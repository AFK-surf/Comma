name: Comma
options:
  minimumXcodeGenVersion: 2.44.1
  createIntermediateGroups: true
  # The Hermes the iOS app runs the client core in (Vendor/hermes), fetched once per release.
  preGenCommand: scripts/fetch-hermes.sh
  # Icon Composer bundles are single resources; actool builds the adaptive and legacy icons from them.
  fileTypes:
    icon:
      file: true
      buildPhase: resources
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.2"
    CURRENT_PROJECT_VERSION: "5"
    CODE_SIGN_STYLE: Automatic
    # Kept here, not only in Xcode: `xcodegen generate` rewrites project.pbxproj.
    DEVELOPMENT_TEAM: D9AAN3VJK8
    COMMA_PHONE_BUNDLE_ID: surf.comma.ios
    COMMA_API_BASE_URL: https://salix-staging.comma.surf
    COMMA_APP_NAME: Comma
    COMMA_PUSH_ENVIRONMENT: development
    # This directory. A project generated elsewhere (the TestFlight build's) names it, as paths in settings are not
    # rewritten.
    COMMA_APPLE_DIR: $(SRCROOT)
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    Release:
      COMMA_APP_NAME: Comma
      COMMA_PUSH_ENVIRONMENT: production
packages:
  CommaCore:
    path: ../../packages/apple-core
  # Apple's CommonMark + GFM parser; agent replies render from its syntax tree.
  Markdown:
    url: https://github.com/swiftlang/swift-markdown
    from: 0.9.0
targets:
  Comma:
    type: application
    platform: iOS
    sources:
      - path: iOS
        excludes: ["*.plist", "*.entitlements", "Core/Comma-Bridging-Header.h"]
      # The Watch's own conversation state and rendering stay with the Watch, which cannot run the client core; the
      # phone reads the core instead (iOS/State, iOS/Chat).
      - path: Shared
        excludes: ["State/**", "Chat/**"]
      - path: Resources
      # The client core's engine, which the Android app shares.
      - path: ../../packages/core/native
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(COMMA_PHONE_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: $(COMMA_APPLE_DIR)/iOS/Core/Comma-Bridging-Header.h
        CLANG_CXX_LANGUAGE_STANDARD: c++20
        HEADER_SEARCH_PATHS:
          - $(COMMA_APPLE_DIR)/Vendor/hermes/include
          - $(COMMA_APPLE_DIR)/../../packages/core/native
        # The core's bundle is made from sources the build phase cannot declare one by one (scripts/bundle-core.sh).
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Bundle the client core
        script: |
          bash "$COMMA_APPLE_DIR/scripts/bundle-core.sh"
        basedOnDependencyAnalysis: false
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: $(COMMA_APP_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        COMMA_API_BASE_URL: $(COMMA_API_BASE_URL)
        COMMA_PUSH_ENVIRONMENT: $(COMMA_PUSH_ENVIRONMENT)
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSSupportsLiveActivities: true
        NSCameraUsageDescription: Take photos to send in your chat or to use as your profile photo.
        NSPhotoLibraryUsageDescription: Show your recent photos so you can send them in your chat.
        NSMicrophoneUsageDescription: Talk with Comma in a voice call.
        # audio: a voice call keeps its microphone and connection while the app is in the background.
        UIBackgroundModes: [audio, remote-notification]
        CFBundleURLTypes:
          - CFBundleURLSchemes: [comma-ios-dev, comma]
    entitlements:
      path: iOS/Comma.entitlements
      properties:
        aps-environment: $(COMMA_PUSH_ENVIRONMENT)
        com.apple.developer.applesignin: [Default]
    dependencies:
      - package: CommaCore
      - framework: Vendor/hermes/hermes.xcframework
        embed: true
      - target: CommaLiveActivity
        embed: true
      - target: CommaWatch
        embed: true
  CommaLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: LiveActivity
        excludes: ["*.plist"]
      - path: Shared/TaskActivityAttributes.swift
      - path: Shared/CallActivity.swift
      - path: Shared/Design/CommaTheme.swift
      - path: Shared/Design/TaskBucketStyle.swift
      - path: Resources/Assets.xcassets
      - path: Resources/Localizable.xcstrings
    dependencies:
      - package: CommaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(COMMA_PHONE_BUNDLE_ID).activity
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: LiveActivity/Info.plist
      properties:
        CFBundleDisplayName: Comma Tasks
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  CommaWatch:
    type: application
    platform: watchOS
    sources:
      - path: iOS/Call/CallAudio.swift
      - path: Watch
        excludes: ["*.plist"]
      - path: Shared
        excludes: [TaskActivityAttributes.swift, CallActivity.swift]
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(COMMA_PHONE_BUNDLE_ID).watch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: $(COMMA_APP_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        WKCompanionAppBundleIdentifier: $(COMMA_PHONE_BUNDLE_ID)
        WKApplication: true
        NSMicrophoneUsageDescription: Talk with Comma in a voice call.
        UIBackgroundModes: [audio]
        COMMA_API_BASE_URL: $(COMMA_API_BASE_URL)
        CFBundleURLTypes:
          - CFBundleURLSchemes: [comma]
        WKSupportsLiveActivityLaunchAttributeTypes: [TaskActivityAttributes]
    dependencies:
      - package: CommaCore
      - package: Markdown
      - target: CommaWatchWidgets
        embed: true
  CommaWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: WatchWidgets
        excludes: ["*.plist"]
      - path: Shared/Design/CommaTheme.swift
      - path: Resources/Assets.xcassets
      - path: Resources/Localizable.xcstrings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(COMMA_PHONE_BUNDLE_ID).watch.widgets
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: WatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Comma
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  CommaWatchTests:
    type: bundle.unit-test
    platform: watchOS
    sources: [WatchTests]
    dependencies:
      - target: CommaWatch
      - package: CommaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(COMMA_PHONE_BUNDLE_ID).watch.tests
        GENERATE_INFOPLIST_FILE: YES
  CommaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Comma
      - package: CommaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(COMMA_PHONE_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Comma:
    build:
      targets:
        Comma: all
    test:
      targets: [CommaTests]
    run:
      config: Debug
  CommaWatch:
    build:
      targets:
        CommaWatch: all
    test:
      targets: [CommaWatchTests]
    run:
      config: Debug
