<!doctype html>
<!-- The document never scrolls: the app fits the viewport and scrolls inside
     its own containers. The root states this inline because the scroll lock of
     a modal (react-aria usePreventScroll) writes this inline value. An equal
     value changes nothing; a new one restyles the whole document on each open
     and close. -->
<html lang="en" style="overflow: hidden">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      href="brand/comma/icon.png"
      data-comma-brand-icon="true"
    />
    <title>%COMMA_PRODUCT_NAME%</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
