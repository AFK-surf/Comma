[package]
name = "comma-mesh-native"
edition = "2024"
version = "0.1.0"
publish = false
description = "The client core's iroh on the phones (the core's engine, clients/packages/core/native): a client's endpoint as the station's addon binds it, its connections and streams, and Salix as the relay of last resort, behind a C ABI. Built once per change of it, shipped prebuilt (systems/station/scripts/native.ts, part client-mesh)."

[lib]
crate-type = ["staticlib"]
name = "comma_mesh"

[dependencies]
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
futures-core = "0.3"
hex = "0.4"
# The station's iroh but for its metrics, which nothing on a phone reads.
iroh = { version = "=1.0.3", default-features = false, features = ["tls-ring", "portmapper", "fast-apple-datapath", "unstable-custom-transports"] }
iroh-base = "=1.0.3"
iroh-mainline-address-lookup = "=0.5.0"
n0-watcher = "1"
noq-proto = { version = "1", default-features = false }
noq-udp = { version = "1", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
webpki-roots = "1"

# A workspace of its own, as the station's addon is.
[workspace]

# The station's vendored crates (systems/station/vendor/README.md): the same iroh as the station and the desktop app.
[patch.crates-io]
noq-udp = { path = "../../../../systems/station/vendor/noq-udp" }
iroh = { path = "../../../../systems/station/vendor/iroh" }

# What a phone downloads: small, whole-program optimized.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
