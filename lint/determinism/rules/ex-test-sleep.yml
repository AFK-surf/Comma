id: ex-test-sleep
language: elixir
severity: error
message: "A test sleeps real time."
note: |
  Settle or move the test clock (settle_receive, settle_until,
  SystemsClock.sleep/advance/run_for under SystemsClock.Test), or wait for
  the message itself.
metadata:
  category: sleep
rule:
  all:
    - kind: call
    # SystemsRuntime.Proc.sleep/1 is Process.sleep/1.
    - has:
        field: target
        regex: "^(Process\\.sleep|:timer\\.sleep|SystemsRuntime\\.Proc\\.sleep)$"
    # A sleep without end reads no time.
    - not:
        has:
          kind: arguments
          has:
            regex: "^:infinity$"
files:
  - "systems/apps/*/test/**/*.exs"
  - "systems/apps/*/test/**/*.ex"
