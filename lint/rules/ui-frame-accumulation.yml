id: ui-frame-accumulation
language: typescript
severity: error
message: "$A accumulates per frame: its value depends on when the frames fell."
note: |
  Compute each frame's state from the time since the motion started, not by
  adding to the last frame's: a spring with springAt/springStateAt and a tween
  with tween (clients/packages/ui/src/motion). Then the state at a moment is
  the same at any frame rate, and a test may jump straight to it.
rule:
  any:
    - pattern: $A += $B * $DT
    - pattern: $A -= $B * $DT
    - pattern: $A += $DT * $B
    - pattern: $A -= $DT * $B
constraints:
  DT:
    {
      regex: "^(dt|dtSeconds|delta|deltaSeconds|deltaMs|seconds|frameSeconds|elapsedSeconds)$",
    }
files:
  - clients/packages/*/src/**/*.ts
  - clients/apps/*/src/**/*.ts
ignores:
  - "**/test/**"
  - "**/*.test.ts"
