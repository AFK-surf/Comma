[package]
name = "salix-vmm-worker"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[lib]
name = "salix_vmm_worker"
path = "src/lib.rs"

[[bin]]
name = "salix_vmm_worker"
path = "src/main.rs"

# Test-only Host: speaks the Host side of `agent-vmm/rpc/1`. Never in the release image.
[[bin]]
name = "salix_vmm_test_host"
path = "src/bin/test_host.rs"
required-features = ["test-host"]

[features]
test-host = ["dep:rcgen"]

[dependencies]
base64 = "0.22"
# Dial-only, inside a Pod: no port mapping, no iroh metrics.
iroh = { version = "1.1", default-features = false, features = ["tls-ring"] }
prost = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
prost-types = "0.14"
rcgen = { version = "0.14", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "io-util", "io-std", "time", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-util = { version = "0.7", features = ["compat", "rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
yamux = "0.13"

[build-dependencies]
prost = "0.14"
prost-build = "0.14"
protox = "0.9"

[dev-dependencies]
salix-vmm-worker = { path = ".", features = ["test-host"] }
tempfile = "3"

[profile.release]
strip = true

[lints.rust]
unsafe_code = "forbid"
