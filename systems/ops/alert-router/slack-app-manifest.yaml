display_information:
  name: Comma Alerts
  description: Posts and updates Comma platform alert lifecycles in Slack.
  background_color: "#111827"
features:
  bot_user:
    display_name: Comma Alerts
    always_online: false
oauth_config:
  scopes:
    bot:
      - channels:history
      - chat:write
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
