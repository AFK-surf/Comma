[package]
name = "stillfail-launcher"
version = "0.1.0"
edition = "2024"
# File::try_lock (data.rs) is stable from 1.89.
rust-version = "1.89"
publish = false

[workspace]

[[bin]]
name = "stillfail-station"
path = "src/main.rs"

# Windows' launcher at logon, with no window (src/hidden.rs).
[[bin]]
name = "stillfail-station-w"
path = "src/hidden.rs"

[dependencies]
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
