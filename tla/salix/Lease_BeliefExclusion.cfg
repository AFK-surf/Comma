\* EXPECTED VIOLATION: leases do not give belief-exclusion — a deposed
\* holder can still think it leads until its next conditional write or
\* assert_owner fails.  This config documents that; the runner asserts TLC
\* finds the violation.
SPECIFICATION Spec
CONSTANTS
  Holder = {h1, h2, h3}
  MaxEpoch = 4
  MaxFaults = 2
  MaxOps = 8
SYMMETRY HolderSym
INVARIANTS
  BeliefExclusive
