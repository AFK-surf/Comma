\* The SHIPPED exposure: the fence read and the CAS are separate steps, so
\* an ownership move between them still lands one stale (but deduped,
\* durable, projection-enumerable) commit.  Expected counterexample — the
\* bound is ExactlyOnceDurable holding in RpcDeliver_Safety.
SPECIFICATION Spec
CONSTANTS
  Nodes = {n1, n2}
  Fence = TRUE
  Dedupe = TRUE
  Staged = TRUE
  Reclassify = TRUE
  SessionAuthority = TRUE
  BirthAuthority = TRUE
  ProbeAuthority = TRUE
  StoreGuard = TRUE
  StrictWritable = TRUE
  RetryLimit = 2
  HopLimit = 2
  MaxMoves = 2
INVARIANTS
  NoStaleCommit
