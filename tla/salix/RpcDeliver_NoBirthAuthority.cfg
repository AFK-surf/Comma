\* BirthAuthority = FALSE retires the create-once birth marker (#873
\* round 6): each concurrent FIRST delivery creates the session on its
\* own admission read, so two writers astride FlipRuntime fabricate the
\* same session id in both stores (source A internal, source B external
\* — the round-6 deterministic repro).  Expected violation of
\* AtMostOneBirthStore.  Shipped behavior claims the marker before any
\* store create (BirthAuthority = TRUE in every other config) and the
\* property holds structurally.
SPECIFICATION Spec
CONSTANTS
  Nodes = {n1, n2}
  Fence = TRUE
  Dedupe = TRUE
  Staged = FALSE
  Reclassify = TRUE
  SessionAuthority = TRUE
  BirthAuthority = FALSE
  ProbeAuthority = TRUE
  StoreGuard = TRUE
  StrictWritable = TRUE
  RetryLimit = 2
  HopLimit = 2
  MaxMoves = 2
INVARIANTS
  AtMostOneBirthStore
