\* Without a session-side dedupe ledger a plain response-loss retry
\* duplicates the durable append — the concrete reason the external store
\* had to gain its own state.json ledger (#870) before external runtimes
\* could enter :rpc mode.
SPECIFICATION Spec
CONSTANTS
  Nodes = {n1, n2}
  Fence = TRUE
  Dedupe = FALSE
  Staged = FALSE
  Reclassify = TRUE
  SessionAuthority = TRUE
  BirthAuthority = TRUE
  ProbeAuthority = TRUE
  StoreGuard = TRUE
  StrictWritable = TRUE
  RetryLimit = 2
  HopLimit = 2
  MaxMoves = 2
INVARIANTS
  ExactlyOnceDurable
