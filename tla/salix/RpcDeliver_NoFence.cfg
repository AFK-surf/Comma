\* Without verify_rpc_delivery_owner, one stale placement resolution lands
\* a durable commit on a node the head no longer names — the #843 review's
\* public-API reproduction.  Exactly-once still holds (dedupe), which is
\* precisely why the fence is a visibility guard, not the dedupe mechanism.
SPECIFICATION Spec
CONSTANTS
  Nodes = {n1, n2}
  Fence = FALSE
  Dedupe = TRUE
  Staged = TRUE
  Reclassify = TRUE
  SessionAuthority = TRUE
  BirthAuthority = TRUE
  ProbeAuthority = TRUE
  StoreGuard = TRUE
  StrictWritable = TRUE
  RetryLimit = 2
  HopLimit = 2
  MaxMoves = 2
INVARIANTS
  NoStaleCommit
