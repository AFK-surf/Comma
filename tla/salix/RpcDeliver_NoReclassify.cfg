\* Reclassify = FALSE models the retired behavior: a same-call
\* internal->external runtime flip made the facade detour to the staged
\* inbox and ack at inbox durability with NO session commit.  Expected
\* violation of AckImpliesDurable (trace: CallerSend classifies "int",
\* FlipRuntime, StageRefuseRuntime acks without touching the session) —
\* the #870 round-2 finding.  Shipped behavior (Reclassify = TRUE in every
\* other config) re-classifies once in-deadline and stays on the rpc path.
SPECIFICATION Spec
CONSTANTS
  Nodes = {n1, n2}
  Fence = TRUE
  Dedupe = TRUE
  Staged = FALSE
  Reclassify = FALSE
  SessionAuthority = TRUE
  BirthAuthority = TRUE
  ProbeAuthority = TRUE
  StoreGuard = TRUE
  StrictWritable = TRUE
  RetryLimit = 2
  HopLimit = 2
  MaxMoves = 2
INVARIANTS
  AckImpliesDurable
