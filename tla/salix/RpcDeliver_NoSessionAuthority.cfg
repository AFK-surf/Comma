\* SessionAuthority = FALSE models the retired agent-record routing
\* (#873 round 5, P1): every delivery, including one addressed to an
\* EXISTING session, chose its store from the mutable agent record — so
\* FlipRuntime between a session's birth commit and the next ordinary
\* delivery fabricated a second same-id session in the other store
\* (source A internal, source B external).  Expected violation of
\* NoSplitSession.  Shipped behavior resolves the session's birth store
\* first (SessionAuthority = TRUE in every other config) and the
\* property holds structurally.
SPECIFICATION Spec
CONSTANTS
  Nodes = {n1, n2}
  Fence = TRUE
  Dedupe = TRUE
  Staged = FALSE
  Reclassify = TRUE
  SessionAuthority = FALSE
  BirthAuthority = TRUE
  ProbeAuthority = TRUE
  StoreGuard = TRUE
  StrictWritable = TRUE
  RetryLimit = 2
  HopLimit = 2
  MaxMoves = 2
INVARIANTS
  NoSplitSession
