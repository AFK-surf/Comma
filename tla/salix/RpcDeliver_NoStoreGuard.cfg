\* StoreGuard = FALSE retires the STORE-layer birth enforcement (#873
\* round 8): a creator that does not pass SessionDelivery's routing —
\* the direct ExternalAgentRuntime ingress, fork/seed — creates the
\* session on its own side, ignoring the marker.  One such create on the
\* opposite side of an existing birth (or of a concurrent routed create)
\* fabricates the same id in both stores — the two round-8 deterministic
\* repros.  Expected violation of AtMostOneBirthStore.  Shipped behavior
\* claims the marker INSIDE the store's create primitives (StoreGuard =
\* TRUE in every other config), so every creator passes it by
\* construction.
SPECIFICATION Spec
CONSTANTS
  Nodes = {n1, n2}
  Fence = TRUE
  Dedupe = TRUE
  Staged = FALSE
  Reclassify = TRUE
  SessionAuthority = TRUE
  BirthAuthority = TRUE
  ProbeAuthority = TRUE
  StoreGuard = FALSE
  StrictWritable = TRUE
  RetryLimit = 2
  HopLimit = 2
  MaxMoves = 2
INVARIANTS
  AtMostOneBirthStore
