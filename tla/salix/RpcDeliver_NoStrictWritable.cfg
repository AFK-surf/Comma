\* StrictWritable = FALSE retires the strict new-input admission (#873
\* round 9, P1-2): an externally-born session whose binding has left
\* (Rebind) still ADMITS a new input id through the minted-capability
\* escape, violating the comma-31 read_only clause — committed ids may
\* keep acking as duplicates, but new work for a departed binding must
\* be refused.  Expected violation of NoLateExternalAdmission.  Shipped
\* behavior checks the CURRENT binding for new-input admission
\* (StrictWritable = TRUE in every other config), scoping the
\* capability escape to in-flight lifecycle/settlement operations.
SPECIFICATION Spec
CONSTANTS
  Nodes = {n1, n2}
  Fence = TRUE
  Dedupe = TRUE
  Staged = FALSE
  Reclassify = TRUE
  SessionAuthority = TRUE
  BirthAuthority = TRUE
  ProbeAuthority = TRUE
  StoreGuard = TRUE
  StrictWritable = FALSE
  RetryLimit = 2
  HopLimit = 2
  MaxMoves = 2
INVARIANTS
  NoLateExternalAdmission
