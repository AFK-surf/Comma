\* The fenced protocol under response loss, same-id retries, ownership
\* moves, stale placement, mixed staged+rpc writers, and 412 reload-retry:
\* the id is durable at most once and every ack has a durable append.
SPECIFICATION Spec
CONSTANTS
  Nodes = {n1, n2}
  Fence = TRUE
  Dedupe = TRUE
  Staged = TRUE
  Reclassify = TRUE
  SessionAuthority = TRUE
  BirthAuthority = TRUE
  ProbeAuthority = TRUE
  StoreGuard = TRUE
  StrictWritable = TRUE
  RetryLimit = 2
  HopLimit = 2
  MaxMoves = 2
INVARIANTS
  TypeOK
  ExactlyOnceDurable
  AckImpliesDurable
  SourceFrontierImpliesDurable
  ExecutionOnSessionRuntime
  NoSplitSession
  AtMostOneBirthStore
  NoLateExternalAdmission
