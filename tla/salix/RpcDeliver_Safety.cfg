\* PG commit checks Agent authority in the same atomic step as Session input.
\* Split-check counterexamples keep Spec and must remain violating.
SPECIFICATION PgSpec
CONSTANTS
  Nodes = {n1, n2}
  Fence = TRUE
  Dedupe = TRUE
  Staged = TRUE
  Reclassify = TRUE
  SessionAuthority = TRUE
  BirthAuthority = TRUE
  ProbeAuthority = TRUE
  StoreGuard = TRUE
  StrictWritable = TRUE
  RetryLimit = 2
  HopLimit = 2
  MaxMoves = 2
INVARIANTS
  TypeOK
  ExactlyOnceDurable
  AckImpliesDurable
  SourceFrontierImpliesDurable
  ExecutionOnSessionRuntime
  NoSplitSession
  AtMostOneBirthStore
  NoLateExternalAdmission
  NoStaleCommit
