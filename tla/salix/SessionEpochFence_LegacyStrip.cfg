\* Expected violation: the mixed-version deploy window. An old node's
\* read-modify-write strips the runtime_epoch stamp (its struct drops
\* unknown keys), so a superseded runner's next read sees epoch 0, is not
\* fenced, and lands a lower-epoch write after the takeover stamp. I1 holds
\* only once the fleet is uniformly on stamping code — this config is the
\* formal record of that caveat.
SPECIFICATION Spec
CONSTANTS
  Runners = {r1, r2}
  MaxEpoch = 3
  MaxWrites = 4
  RebaseOnEpochRegression = FALSE
  ModelLegacyWriters = TRUE
SYMMETRY RunnerSym
INVARIANTS
  TypeOK
  FenceSafety
