\* Safety: three runners (symmetry-reduced), fixed fence behavior
\* (epoch regression is terminal, never a rebase), nudge deliberately
\* weak (cannot cancel an in-flight CAS).
SPECIFICATION Spec
CONSTANTS
  Runners = {r1, r2, r3}
  MaxEpoch = 4
  MaxWrites = 5
  RebaseOnEpochRegression = FALSE
  ModelLegacyWriters = FALSE
SYMMETRY RunnerSym
INVARIANTS
  TypeOK
  FenceSafety
  NoObjectEpochRegression
  FencedRunnersStop
