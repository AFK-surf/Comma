\* Expected violation: the pre-fix commit loop (rebase-and-retry on every
\* CAS conflict, no epoch comparison) lets a superseded runner re-land a
\* lower-epoch write after the takeover stamp — FenceSafety must fail.
SPECIFICATION Spec
CONSTANTS
  Runners = {r1, r2}
  MaxEpoch = 3
  MaxWrites = 4
  RebaseOnEpochRegression = TRUE
  ModelLegacyWriters = FALSE
SYMMETRY RunnerSym
INVARIANTS
  TypeOK
  FenceSafety
