\* One payload is sufficient here because fresh event identity already distinguishes
\* competing materializations; keep both crash and ambiguity depth at two.
SPECIFICATION Spec
CONSTANTS
  Nodes = {n1}
  MaxSeq = 3
  Payloads = {1}
  MaxCrash = 2
  MaxAmb = 2
  MaxFid = 6
  SettleByFlushId = TRUE
  CreateBeforeAdvance = TRUE
  ChunkFromDurable = TRUE
  LateApplyInFlight = FALSE
INVARIANTS
  TypeOK
  HotMatchesDurable
  SingleMaterialization
  ArchiveConvergence
  NoRecordLoss
  WindowComplete
  WindowExact
  AckedIsDurable
  WatermarkOrder
